name: C01 Migration Bootstrap

on:
  push:
    branches:
      - audit/c01-apply-2026-09-27

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Scaffold C01 migration
        shell: bash
        run: |
          set -euo pipefail
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_c01_corporate_domains_and_profile_alignment.sql' | grep -q .; then
            supabase migration new c01_corporate_domains_and_profile_alignment
          fi

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: scaffold C01 corrective migration"
          git push
