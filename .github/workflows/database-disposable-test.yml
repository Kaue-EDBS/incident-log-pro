name: Database Disposable Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Rebuild database from canonical migrations
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db

      - name: Test direct Data API denial
        run: bash .github/scripts/test-safra-direct-api.sh

      - name: Rehearse rollback of latest migration
        run: |
          supabase migration down --local --last 1
          cp supabase/rollback-tests/c05_latest_rollback.test.sql supabase/tests/database/__c05_rollback.test.sql
          supabase test db supabase/tests/database/__c05_rollback.test.sql
          rm supabase/tests/database/__c05_rollback.test.sql
          supabase db reset --local
          supabase test db

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
