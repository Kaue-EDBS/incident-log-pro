name: Database Disposable Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-disposable-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Matrix v3 reconciliation contract
        run: python3 .github/scripts/check-matrix-v3-reconciliation-contract.py

      - name: Setup Bun (front-end smoke)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start disposable Supabase stack
        run: |
          set -euo pipefail

          start_stack() {
            timeout 360s supabase start
          }

          # Defensive cleanup: GitHub-hosted runners occasionally retain a
          # partially-created local Supabase stack after a Docker/network hiccup.
          timeout 45s supabase stop --no-backup >/dev/null 2>&1 || true

          if start_stack; then
            exit 0
          fi

          echo "::warning::First Supabase start attempt failed or timed out. Collecting diagnostics and retrying once."
          docker ps -a || true
          docker network ls || true
          timeout 45s supabase stop --no-backup || true
          sleep 5

          start_stack

      - name: Rebuild database from canonical migrations
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db

      - name: Test concurrent START idempotency
        run: bash .github/scripts/test-safra-start-concurrency.sh

      - name: Test concurrent END x CANCEL
        run: bash .github/scripts/test-safra-end-cancel-concurrency.sh

      - name: Test concurrent close x cancel (RPC)
        run: bash .github/scripts/test-safra-close-cancel-rpc-concurrency.sh

      - name: Test direct Data API denial
        run: bash .github/scripts/test-safra-direct-api.sh

      - name: Test direct RPC denial
        run: bash .github/scripts/test-safra-direct-rpc.sh

      - name: Stress smoke (parallel open/close/cancel)
        run: |
          bash .github/scripts/test-safra-stress.sh > /tmp/stress.log 2>&1 || {
            cat /tmp/stress.log
            python3 .github/scripts/annotate-log.py /tmp/stress.log "Stress smoke"
            exit 1
          }
          cat /tmp/stress.log
          python3 .github/scripts/annotate-log.py /tmp/stress.log "Stress smoke" notice

      - name: Front-end smoke (Playwright + axe)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          bunx playwright install --with-deps chromium
          export VITE_SUPABASE_URL="${API_URL}" VITE_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}"
          export SUPABASE_URL="${API_URL}" SUPABASE_PUBLISHABLE_KEY="${ANON_KEY}"
          bun run dev --port 8080 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/auth; then break; fi
            sleep 2
          done
          E2E_SUPABASE_URL="${API_URL}" E2E_JWT_SECRET="${JWT_SECRET}" E2E_DB_URL="${DB_URL}"             bunx playwright test -c e2e/playwright.config.ts > /tmp/e2e.log 2>&1 || {
              cat /tmp/e2e.log; tail -n 80 /tmp/vite.log
              python3 .github/scripts/annotate-log.py /tmp/e2e.log "Front-end smoke"
              exit 1
            }
            cat /tmp/e2e.log

      - name: Rehearse rollback of latest migration
        run: |
          LATEST_VERSION="$(basename "$(ls supabase/migrations/*.sql | sort | tail -1)" | cut -d_ -f1)"
          printf 'y\n' | supabase migration down --local --last 1
          sed "s/__LATEST_VERSION__/${LATEST_VERSION}/g"             supabase/rollback-tests/latest_migration_rollback.test.sql             > supabase/tests/database/__latest_rollback.test.sql
          supabase test db supabase/tests/database/__latest_rollback.test.sql
          rm supabase/tests/database/__latest_rollback.test.sql
          supabase db reset --local
          supabase test db

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
