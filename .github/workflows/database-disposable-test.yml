name: Database Disposable Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: database-disposable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Matrix v3 reconciliation contract
        run: python3 .github/scripts/check-matrix-v3-reconciliation-contract.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Rebuild database from canonical migrations
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db

      - name: Test direct Data API denial
        run: bash .github/scripts/test-safra-direct-api.sh

      - name: Rehearse rollback of latest migration
        run: |
          LATEST_VERSION="$(basename "$(ls supabase/migrations/*.sql | sort | tail -1)" | cut -d_ -f1)"
          printf 'y\n' | supabase migration down --local --last 1
          sed "s/__LATEST_VERSION__/${LATEST_VERSION}/g"             supabase/rollback-tests/latest_migration_rollback.test.sql             > supabase/tests/database/__latest_rollback.test.sql
          supabase test db supabase/tests/database/__latest_rollback.test.sql
          rm supabase/tests/database/__latest_rollback.test.sql
          supabase db reset --local
          supabase test db

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
