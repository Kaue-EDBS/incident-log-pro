name: Database Disposable Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: database-disposable-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Matrix v3 reconciliation contract
        run: python3 .github/scripts/check-matrix-v3-reconciliation-contract.py

      - name: C05 migration authority
        run: python3 .github/scripts/check-c05-migration-authority.py


      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start disposable Supabase stack
        run: |
          set -euo pipefail

          start_stack() {
            timeout 360s supabase start
          }

          # Defensive cleanup: GitHub-hosted runners occasionally retain a
          # partially-created local Supabase stack after a Docker/network hiccup.
          timeout 45s supabase stop --no-backup >/dev/null 2>&1 || true

          if start_stack; then
            exit 0
          fi

          echo "::warning::First Supabase start attempt failed or timed out. Collecting diagnostics and retrying once."
          docker ps -a || true
          docker network ls || true
          timeout 45s supabase stop --no-backup || true
          sleep 5

          start_stack

      - name: Rebuild database from canonical migrations
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db

      - name: Test concurrent START idempotency
        run: bash .github/scripts/test-safra-start-concurrency.sh

      - name: Test concurrent END x CANCEL
        run: bash .github/scripts/test-c05-end-cancel-concurrency.sh

      - name: Test direct Data API denial
        run: bash .github/scripts/test-safra-direct-api.sh

      - name: Test authenticated direct Data API denial
        run: bash .github/scripts/test-c05-authenticated-direct-api.sh

      - name: Test direct RPC denial
        run: bash .github/scripts/test-safra-direct-rpc.sh

      - name: Rehearse structural rollback of C05 latest migration
        run: |
          set -euo pipefail
          LATEST_VERSION="$(basename "$(ls supabase/migrations/*.sql | sort | tail -1)" | cut -d_ -f1)"
          if [[ "${LATEST_VERSION}" != "20260928095246" ]]; then
            echo "Expected C05 structural rollback target 20260928095246, found ${LATEST_VERSION}."
            echo "Update the C05 rollback contract before changing the latest migration."
            exit 1
          fi

          printf 'y\n' | supabase migration down --local --last 1

          cp supabase/rollback-tests/c05_block_c_structural_rollback.test.sql \
             supabase/tests/database/__c05_structural_rollback.test.sql
          supabase test db supabase/tests/database/__c05_structural_rollback.test.sql
          rm supabase/tests/database/__c05_structural_rollback.test.sql

          # Rebuild the canonical current state and prove the forward path again.
          supabase db reset --local
          supabase test db

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
