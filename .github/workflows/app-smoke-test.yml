name: App Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Known HIGH dependency floors
        run: python3 .github/scripts/check-known-vulnerable-dependency-floors.py

      - name: General dependency audit
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Lint legacy baseline
        continue-on-error: true
        run: bun run lint
