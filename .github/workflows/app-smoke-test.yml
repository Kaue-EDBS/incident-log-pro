name: App Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Product gates P1-P4
        run: python3 .github/scripts/check-product-gates.py

      - name: C06.1 UI/server authorization coherence
        run: python3 .github/scripts/check-c06-1-ui-auth-coherence.py

      - name: C04 authorization surface coherence
        run: python3 .github/scripts/check-c04-authorization-surface.py

      - name: C05 migration authority
        run: python3 .github/scripts/check-c05-migration-authority.py



      - name: C07 analytics timezone contract - UTC host
        run: TZ=UTC bun .github/scripts/test-c07-analytics-timezone.ts

      - name: C07 analytics timezone contract - alternate host
        run: TZ=Asia/Tokyo bun .github/scripts/test-c07-analytics-timezone.ts

      - name: C01 corporate access coherence
        run: python3 .github/scripts/check-c01-corporate-access-coherence.py

      - name: C01 runtime contracts
        run: bun test ./.github/tests/c01-runtime-contracts.test.ts

      - name: C02 threat-model coherence
        run: python3 .github/scripts/check-c02-threat-model-coherence.py

      - name: C03 route/domain coherence
        run: python3 .github/scripts/check-c03-route-coherence.py

      - name: C03 Safra vs legacy TI boundary
        run: python3 .github/scripts/check-c03-domain-boundary.py

      - name: Known HIGH dependency floors
        run: python3 .github/scripts/check-known-vulnerable-dependency-floors.py

      - name: General dependency audit
        run: |
          for attempt in 1 2 3; do
            echo "Dependency audit attempt ${attempt}/3"
            if bun audit --audit-level=high; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Dependency audit failed after 3 attempts."
          exit 1

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
