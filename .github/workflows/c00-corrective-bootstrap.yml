name: C00 Corrective Bootstrap

on:
  push:
    branches:
      - audit/c00-corrections-2026-09-27

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scaffold least-privilege migration through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_c00_restore_legacy_least_privilege.sql' | grep -q .; then
            supabase migration new c00_restore_legacy_least_privilege
          fi

      - name: Apply repository formatting baseline
        run: bun run format

      - name: Apply safe ESLint autofixes
        run: bunx eslint . --fix || true

      - name: Commit generated migration and mechanical cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap C00 corrective cleanup"
          git push
